<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R. Phone et Accessoire</title>

  <link rel="stylesheet" href="style.css?v=21">
</head>

<body>

  <header class="hero">
    <img src="logo.png" alt="R. Phone et Accessoire">
    <h1>R. Phone et Accessoire</h1>
    <p>إكسسوارات الهواتف</p>
  </header>

  <main class="wrap">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="ابحث عن منتج..."
        autocomplete="off"
      >
    </div>

    <div class="filters" id="filters">
      <button class="active" data-category="all">الكل</button>
      <button data-category="شواحن">شواحن</button>
      <button data-category="ساعات ذكية">ساعات ذكية</button>
      <button data-category="سماعات أذن">سماعات أذن</button>
      <button data-category="سماعات رأس">سماعات رأس</button>
      <button data-category="باور بانك">باور بانك</button>
      <button data-category="مكبرات صوت">مكبرات صوت</button>
      <button data-category="أخرى">أخرى</button>
    </div>

    <p id="status" class="muted" style="text-align:center;">
      جاري الاتصال...
    </p>

    <section id="products" class="grid"></section>

    <p id="error" class="muted" style="text-align:center;"></p>

    <section class="contact">
      <h2>تواصل معنا</h2>

      <div class="socials">

        <a
          href="https://www.instagram.com/r.phone28/"
          target="_blank"
          rel="noopener"
        >
          <img src="instagram.png" alt="Instagram">
          Instagram
        </a>

        <a
          href="https://www.facebook.com/share/19WoBY8E32/"
          target="_blank"
          rel="noopener"
        >
          <img src="facebook.png" alt="Facebook">
          Facebook
        </a>

        <a
          href="https://wa.me/213659788783"
          target="_blank"
          rel="noopener"
        >
          <img src="whatsapp.png" alt="WhatsApp">
          WhatsApp
        </a>

        <a
          href="https://www.tiktok.com/@moh_algeria1"
          target="_blank"
          rel="noopener"
        >
          <img src="tiktok.png" alt="TikTok">
          TikTok
        </a>

      </div>
    </section>

  </main>

  <!-- إعدادات Supabase -->
  <script src="config.js?v=21"></script>

  <script>

    let allProducts = [];
    let currentCategory = "all";

    const productsEl = document.getElementById("products");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const searchInput = document.getElementById("searchInput");

    function showError(message) {
      errorEl.textContent = message;
    }

    function formatPrice(price) {
      return Number(price).toLocaleString("fr-DZ") + " DA";
    }

    function renderProducts() {

      productsEl.innerHTML = "";

      const searchText = String(searchInput.value || "")
        .trim()
        .toLowerCase();

      const filtered = allProducts.filter(product => {

        const categoryMatch =
          currentCategory === "all" ||
          product.category === currentCategory;

        const searchMatch =
          !searchText ||
          String(product.name || "")
            .toLowerCase()
            .includes(searchText) ||
          String(product.description || "")
            .toLowerCase()
            .includes(searchText);

        return categoryMatch && searchMatch;
      });

      if (filtered.length === 0) {

        productsEl.innerHTML =
          '<p class="muted" style="grid-column:1/-1;text-align:center;">لا توجد منتجات.</p>';

        return;
      }

      filtered.forEach(product => {

        const card = document.createElement("article");
        card.className = "card";

        const image = document.createElement("img");

        image.src = product.image_url || "logo.png";
        image.alt = product.name || "منتج";

        image.onerror = function () {
          this.src = "logo.png";
        };

        const body = document.createElement("div");
        body.className = "card-body";

        const category = document.createElement("div");
        category.className = "cat";
        category.textContent = product.category || "";

        const name = document.createElement("h3");
        name.textContent = product.name || "";

        const description = document.createElement("p");
        description.textContent = product.description || "";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = formatPrice(product.price);

        const whatsapp = document.createElement("a");

        whatsapp.className = "wa";
        whatsapp.target = "_blank";
        whatsapp.rel = "noopener";

        const message =
          "السلام عليكم، أريد الاستفسار عن المنتج: " +
          (product.name || "") +
          " - السعر: " +
          formatPrice(product.price);

        whatsapp.href =
          "https://wa.me/213659788783?text=" +
          encodeURIComponent(message);

        whatsapp.textContent = "طلب عبر واتساب";

        body.appendChild(category);
        body.appendChild(name);
        body.appendChild(description);
        body.appendChild(price);
        body.appendChild(whatsapp);

        card.appendChild(image);
        card.appendChild(body);

        productsEl.appendChild(card);
      });
    }

    async function loadProducts() {

      try {

        statusEl.textContent = "جاري تحميل المنتجات...";
        showError("");

        if (
          typeof SUPABASE_URL === "undefined" ||
          typeof SUPABASE_ANON_KEY === "undefined"
        ) {
          throw new Error("ملف config.js غير محمل بشكل صحيح.");
        }

        const controller = new AbortController();

        const timeout = setTimeout(() => {
          controller.abort();
        }, 10000);

        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/products?select=*&order=created_at.desc",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": "Bearer " + SUPABASE_ANON_KEY
            },

            signal: controller.signal
          }
        );

        clearTimeout(timeout);

        if (!response.ok) {

          const errorText = await response.text();

          throw new Error(
            "Supabase HTTP " +
            response.status +
            ": " +
            errorText
          );
        }

        allProducts = await response.json();

        statusEl.textContent =
          "تم تحميل " + allProducts.length + " منتج";

        renderProducts();

      } catch (error) {

        console.error(error);

        if (error.name === "AbortError") {

          statusEl.textContent = "انتهت مهلة الاتصال";

          showError(
            "لم يستجب Supabase خلال 10 ثوانٍ."
          );

        } else {

          statusEl.textContent = "حدث خطأ";

          showError(
            error.message || "تعذر تحميل المنتجات."
          );
        }
      }
    }

    document
      .getElementById("filters")
      .addEventListener("click", function(event) {

        const button = event.target.closest("button");

        if (!button) return;

        document
          .querySelectorAll("#filters button")
          .forEach(btn => {
            btn.classList.remove("active");
          });

        button.classList.add("active");

        currentCategory =
          button.getAttribute("data-category") || "all";

        renderProducts();
      });

    searchInput.addEventListener("input", function() {
      renderProducts();
    });

    document.addEventListener("DOMContentLoaded", function() {
      loadProducts();
    });

  </script>

</body>
</html>
