<title>R. Phone et Accessoire</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at top,#e9e9e9,#f7f7f7 45%,#ededed);
  color:#111;
}

/* =========================
   HEADER
========================= */

.hero{
  position:relative;
  margin:15px auto 0;
  width:min(1100px,94%);
  padding:30px 20px 25px;
  text-align:center;
  color:#fff;
  background:rgba(10,10,10,.86);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.16);
  border-radius:26px;
  box-shadow:0 15px 45px rgba(0,0,0,.18);
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:26px;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.13),
    transparent 45%
  );
  pointer-events:none;
}

.hero img{
  position:relative;
  width:88px;
  height:88px;
  object-fit:contain;
  margin-bottom:7px;
}

.hero h1{
  position:relative;
  margin:4px 0;
  font-size:27px;
  font-weight:900;
}

.hero p{
  position:relative;
  margin:8px 0 0;
  color:#d8d8d8;
  font-size:14px;
}
