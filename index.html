<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R. Phone et Accessoire</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="hero"><img src="logo.png" alt="R. Phone et Accessoire"><h1>R. Phone et Accessoire</h1><p>إكسسوارات الهواتف</p></header><main class="wrap"><div id="filters" class="filters"></div><section id="products" class="grid"></section><p id="empty" class="muted" style="text-align:center">لا توجد منتجات حاليًا.</p><section class="contact"><h2>تواصل معنا</h2><div class="socials"><a href="https://www.instagram.com/r.phone28/" target="_blank"><img src="https://cdn.simpleicons.org/instagram/ffffff">Instagram</a><a href="https://www.facebook.com/share/19WoBY8E32/" target="_blank"><img src="https://cdn.simpleicons.org/facebook/ffffff">Facebook</a><a href="https://wa.me/213659788783" target="_blank"><img src="https://cdn.simpleicons.org/whatsapp/ffffff">WhatsApp: 0659788783</a><a href="https://www.tiktok.com/@moh_algeria1" target="_blank"><img src="https://cdn.simpleicons.org/tiktok/ffffff">TikTok</a></div></section></main><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let all=[];let cat='الكل';async function load(){const{data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){document.getElementById('products').innerHTML='<p>حدث خطأ في تحميل المنتجات.</p>';return}all=data||[];drawFilters();draw()}function drawFilters(){const cats=['الكل',...new Set(all.map(x=>x.category).filter(Boolean))];document.getElementById('filters').innerHTML=cats.map(x=>`<button class="${x===cat?'active':''}" onclick="cat='${x.replaceAll("'","\\'")}';drawFilters();draw()">${x}</button>`).join('')}function draw(){const list=cat==='الكل'?all:all.filter(x=>x.category===cat);document.getElementById('empty').style.display=list.length?'none':'block';document.getElementById('products').innerHTML=list.map(p=>{const img=p.image_url?`<img src="${p.image_url}" alt="${esc(p.name)}">`:'<div style="height:190px;background:#eee"></div>';const msg=encodeURIComponent(`السلام عليكم، أريد طلب: ${p.name} بسعر ${p.price} دج`);return `<article class="card">${img}<div class="card-body"><div class="cat">${esc(p.category||'إكسسوارات')}</div><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="price">${Number(p.price).toLocaleString('fr-DZ')} دج</div><a class="wa" target="_blank" href="https://wa.me/213659788783?text=${msg}">اطلب عبر واتساب</a></div></article>`}).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
