<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة المنتجات</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="admin"><h1>لوحة إدارة R. Phone et Accessoire</h1><div id="login" class="form"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button><p id="loginMsg"></p></div><div id="panel" class="hidden"><div class="form"><h2 id="formTitle">إضافة منتج</h2><input id="name" placeholder="اسم المنتج"><textarea id="desc" placeholder="وصف المنتج"></textarea><div class="row"><input id="price" type="number" placeholder="السعر بالدينار"><select id="category"><option value="شواحن">شواحن</option><option value="ساعات ذكية">ساعات ذكية</option><option value="سماعات أذن">سماعات أذن</option><option value="سماعات رأس">سماعات رأس</option><option value="باور بانك">باور بانك</option><option value="مكبرات صوت">مكبرات صوت</option><option value="أخرى">أخرى</option></select></div><input id="image" type="file" accept="image/*"><button class="btn" onclick="save()">حفظ المنتج</button> <button class="btn" onclick="resetForm()">إلغاء</button><p id="msg"></p></div><div class="admin-list" id="list"></div><button class="btn" onclick="logout()">تسجيل الخروج</button></div></main><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let editing=null;async function init(){const{data:{session}}=await db.auth.getSession();show(session)}function show(s){document.getElementById('login').classList.toggle('hidden',!!s);document.getElementById('panel').classList.toggle('hidden',!s);if(s)load()}async function login(){const{data,error}=await db.auth.signInWithPassword({email:email.value,password:password.value});loginMsg.textContent=error?error.message:'تم الدخول';if(data.session)show(data.session)}async function logout(){await db.auth.signOut();show(null)}async function load(){const{data}=await db.from('products').select('*').order('created_at',{ascending:false});list.innerHTML=(data||[]).map(p=>`<div class="item"><img src="${p.image_url||'logo.png'}"><div style="flex:1"><b>${esc(p.name)}</b><div>${Number(p.price).toLocaleString('fr-DZ')} دج — ${esc(p.category||'')}</div></div><button class="btn" onclick='edit(${JSON.stringify(p)})'>تعديل</button><button class="btn danger" onclick="del(${p.id})">حذف</button></div>`).join('')}function edit(p){editing=p;name.value=p.name;desc.value=p.description||'';price.value=p.price;category.value=p.category||'أخرى';formTitle.textContent='تعديل المنتج';window.scrollTo(0,0)}function resetForm(){editing=null;name.value='';desc.value='';price.value='';image.value='';formTitle.textContent='إضافة منتج'}async function save(){const msgEl=document.getElementById('msg');const nameEl=document.getElementById('name');const descEl=document.getElementById('desc');const priceEl=document.getElementById('price');const categoryEl=document.getElementById('category');const imageEl=document.getElementById('image');const formTitleEl=document.getElementById('formTitle');msgEl.textContent='جارٍ الحفظ...';try{const{data:{session}}=await db.auth.getSession();if(!session){msgEl.textContent='انتهت جلسة الدخول. سجّل الدخول من جديد.';return}let url=editing?.image_url||null;const f=imageEl.files[0];if(f){msgEl.textContent='تم الاتصال بالحساب، جارٍ رفع الصورة...';const path=crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'');const up=await Promise.race([db.storage.from('products').upload(path,f,{upsert:false}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('انتهى وقت رفع الصورة')),20000))]);if(up.error){msgEl.textContent='خطأ رفع الصورة: '+up.error.message;return}url=db.storage.from('products').getPublicUrl(path).data.publicUrl}msgEl.textContent='تم رفع الصورة، جارٍ إضافة المنتج...';const obj={name:nameEl.value.trim(),description:descEl.value.trim(),price:Number(priceEl.value),category:categoryEl.value,image_url:url};if(!obj.name||!Number.isFinite(obj.price)){msgEl.textContent='تأكد من اسم المنتج والسعر.';return}const res=await Promise.race([(editing?db.from('products').update(obj).eq('id',editing.id):db.from('products').insert(obj)),new Promise((_,reject)=>setTimeout(()=>reject(new Error('انتهى وقت حفظ المنتج. تحقق من اتصال Supabase أو صلاحيات جدول products.')),20000))]);if(res.error){msgEl.textContent='خطأ قاعدة البيانات: '+res.error.message;return}msgEl.textContent='تم الحفظ بنجاح';resetForm();await load()}catch(e){msgEl.textContent='حدث خطأ: '+(e?.message||e)} }async function del(id){if(!confirm('هل تريد حذف المنتج؟'))return;const{error}=await db.from('products').delete().eq('id',id);if(error)alert(error.message);else load()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
