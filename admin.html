<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة المنتجات</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>

<body>

<main class="admin">

<h1>لوحة إدارة R. Phone et Accessoire</h1>

<div id="login" class="form">

<h2>تسجيل الدخول</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button class="btn" id="loginBtn">دخول</button>

<p id="loginMsg"></p>

</div>


<div id="panel" class="hidden">

<div class="form">

<h2 id="formTitle">إضافة منتج</h2>

<input id="name" placeholder="اسم المنتج">

<textarea id="desc" placeholder="وصف المنتج"></textarea>

<div class="row">

<input id="price" type="number" placeholder="السعر بالدينار">

<select id="category">

<option value="شواحن">شواحن</option>
<option value="ساعات ذكية">ساعات ذكية</option>
<option value="سماعات أذن">سماعات أذن</option>
<option value="سماعات رأس">سماعات رأس</option>
<option value="باور بانك">باور بانك</option>
<option value="مكبرات صوت">مكبرات صوت</option>
<option value="أخرى">أخرى</option>

</select>

</div>

<input id="image" type="file" accept="image/*">

<button class="btn" id="saveBtn">حفظ المنتج</button>

<button class="btn" id="cancelBtn">إلغاء</button>

<p id="msg"></p>

</div>

<div class="admin-list" id="list"></div>

<button class="btn" id="logoutBtn">تسجيل الخروج</button>

</div>

</main>
